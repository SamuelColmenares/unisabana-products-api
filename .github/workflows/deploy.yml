name: CI/CD Pipeline to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: products-api
  IMAGE_NAME: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mi-app/products-api

jobs:
  # ==========================================
  # 1. TRABAJO DE INTEGRACIÓN CONTINUA (CI)
  # ==========================================
  ci:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar Dependencias
        run: dotnet restore ProductsApi.slnx

      - name: Compilar Solución
        run: dotnet build ProductsApi.slnx --configuration Release --no-restore

      - name: Ejecutar Pruebas Unitarias
        run: dotnet test ProductsApi.slnx --configuration Release --no-build --verbosity normal

  # ==========================================
  # 2. TRABAJO DE DESPLIEGUE CONTINUO (CD)
  # ==========================================
  cd:
    name: Build Image and Deploy
    runs-on: ubuntu-latest
    needs: ci 
    permissions:
      contents: read
      id-token: write   

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Autenticar con Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Login a Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build y push imagen Docker
        run: |
          docker build \
            -f ./ProductsApi/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy a Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}